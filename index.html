<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algebra Solver</title>
  <link href="css/output.css" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <div id="messages" class="flex-1 overflow-y-auto p-6"></div>
    <form id="solver-form" class="input-container">
      <textarea id="equation" class="equation-textarea" placeholder="Enter equation (e.g., '2*x + 3 = 9', 'x^2 - 4 = 0', 'simplify: x^2 + 2x + 1')"></textarea>
      <div class="flex gap-2 mt-2">
        <button id="send-btn" type="submit" class="send-btn">Solve</button>
        <select id="solver-type" class="p-2 border rounded">
          <option value="mathjs">math.js (Algebra)</option>
          <option value="pyodide">SymPy (Advanced)</option>
        </select>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
